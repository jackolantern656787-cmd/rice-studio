# Tideglass: ocean slate / lavender, scoped terminal preset.
font_family Noto Sans Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11
foreground #d9dce8
background #293a46
background_opacity 0.38
cursor #d6c1f2
cursor_text_color #202637
selection_foreground #202637
selection_background #bca6da
active_border_color #c8b5e9
inactive_border_color #66738b
window_padding_width 8
url_color #bedee9
color0 #202637
color1 #d69daa
color2 #a9c7bc
color3 #d8ceb4
color4 #a6bdd8
color5 #bca6da
color6 #9ebecb
color7 #d9dce8
color8 #566178
color9 #e8b7c2
color10 #c0dfd1
color11 #ede2c8
color12 #c2d5f0
color13 #d6c1f2
color14 #bedee9
color15 #f1edfa
symbol_map U+E000-U+F8FF JetBrainsMono Nerd Font Mono
symbol_map U+F0000-U+FFFFD JetBrainsMono Nerd Font Mono

# Wide starting size for new floating terminal windows.
remember_window_size no
initial_window_width 1200
initial_window_height 700
