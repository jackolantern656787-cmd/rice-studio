add_newline = true
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"
[directory]
style = "#adc9ef"
format = "[$path]($style) "
truncation_length = 3
[git_branch]
style = "#a5a6d1"
format = "[$symbol$branch]($style) "
[git_status]
style = "#94b8b2"
format = "[$all_status$ahead_behind]($style) "
[cmd_duration]
min_time = 2000
style = "#94a3c2"
format = "[$duration]($style) "
[character]
success_symbol = "[❯](#9baedb)"
error_symbol = "[❯](#dfacbc)"
