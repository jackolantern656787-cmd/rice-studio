# Cyanframe: smoky cyan, scoped terminal preset.
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10.5
foreground #d8e5e3
background #202b30
background_opacity 0.50
cursor #b6e2e7
cursor_text_color #17242b
selection_foreground #17242b
selection_background #77cbd6
active_border_color #bbd8dc
inactive_border_color #58737d
window_padding_width 8
url_color #b7e3e7
color0 #17242b
color1 #cd9b9d
color2 #9ec8b2
color3 #d4c8b4
color4 #7ebbd1
color5 #77cbd6
color6 #77cbd6
color7 #d8e5e3
color8 #4c6773
color9 #e6b9bb
color10 #b7e0c9
color11 #e6e4c9
color12 #9ed7ec
color13 #b6e2e7
color14 #b7e3e7
color15 #edf4ee
symbol_map U+E000-U+F8FF JetBrainsMono Nerd Font Mono
symbol_map U+F0000-U+FFFFD JetBrainsMono Nerd Font Mono

# Wide starting size for new floating terminal windows.
remember_window_size no
initial_window_width 1200
initial_window_height 700
