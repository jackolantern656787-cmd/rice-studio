# vim:ft=kitty

## name:     Catppuccin Kitty Mocha
## author:   Catppuccin Org
## license:  MIT
## upstream: https://github.com/catppuccin/kitty/blob/main/themes/mocha.conf
## blurb:    Soothing pastel theme for the high-spirited!



# The basic colors
foreground #e7d8b8
background #171510
selection_foreground #171510
selection_background #e5c890

# Cursor colors
cursor #e5c890
cursor_text_color #171510

# Scrollbar colors
scrollbar_handle_color  #9399b2
scrollbar_track_color   #45475a

# URL color when hovering with mouse
url_color               #f5e0dc

# Kitty window border colors
active_border_color #e5c890
inactive_border_color #6c5e45
bell_border_color       #f9e2af

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground #171510
active_tab_background #e5c890
inactive_tab_foreground #b6a98d
inactive_tab_background #12110d
tab_bar_background #0c0b08

# Colors for marks (marked text in the terminal)
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# The 16 terminal colors

# black
color0 #302b21
color8 #5a503b

# red
color1 #d48c7f
color9 #d48c7f

# green
color2 #b7bd8b
color10 #b7bd8b

# yellow
color3 #e5c890
color11 #e5c890

# blue
color4 #b8b4a2
color12 #b8b4a2

# magenta
color5 #d1b19c
color13 #d1b19c

# cyan
color6 #aaa98a
color14 #aaa98a

# white
color7 #d1c1a0
color15 #e7d8b8

# Nerd Font icons while retaining the existing text font.
symbol_map U+E000-U+F8FF GoogleSansCode Nerd Font
symbol_map U+F0000-U+FFFFD GoogleSansCode Nerd Font
